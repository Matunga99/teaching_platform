name: teaching_platform
description: A Flutter-based teaching platform with local storage support for offline learning.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0

  # UI & Animations
  flutter_screenutil: ^5.9.0
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # API & Networking
  dio: ^5.3.0
  retrofit: ^4.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1

  # Logging
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.0
  retrofit_generator: ^7.1.1
  freezed: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
